name: news_app
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  cached_network_image: ^3.4.1
  intl: 0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/json/



flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/icon/app_icon.png"
    min_sdk_android: 21